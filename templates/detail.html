{% extends "base.html" %}
{% block main %}
<article><h2>{{ post.title }}</h2><time>{{ post.date|date:"d/m/Y H:i" }}</time>
{{ post.content|safe }}</article>
<p><a href="{% url 'post_update' post.pk %}">Editar projeto</a> · <a href="{% url 'post_delete' post.pk %}">Excluir projeto</a></p>
{% endblock %}
