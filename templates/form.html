{% extends "base.html" %}
{% block main %}
<h2>{% if post %}Editar projeto{% else %}Novo projeto{% endif %}</h2>
<form method="post">{% csrf_token %}
<p><label>Título <input name="title" value="{{ post.title }}"></label></p>
<p><label>Conteúdo em HTML <textarea name="content">{{ post.content }}</textarea></label></p>
<button>Salvar</button></form>
{% endblock %}
