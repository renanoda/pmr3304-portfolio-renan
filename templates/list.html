{% extends "base.html" %}
{% block main %}
{% if category %}<h2>{{ category.name }}</h2><p>{{ category.description }}</p>
{% else %}<h2>Projetos e experiências</h2>{% endif %}
<ul>{% for post in posts %}
<li><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></li>
{% empty %}<li>Nenhum projeto publicado.</li>{% endfor %}</ul>
{% endblock %}
